<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<title>Carrito de compras — Ensambla.me</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Revisa, modifica y totaliza los productos y armados de tu carrito.">
		<link rel="icon" href="../resources/img/logo.svg" type="image/svg+xml">
		<link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
		<link rel="stylesheet" href="../styles/style.css">
	</head>
	<body>
		<!-- Las secciones compartidas se cargan desde su propio archivo con scripts/includes.js -->
		<header data-include="header.html"></header>
		<nav data-include="nav.html"></nav>

		<div class="container my-4">
			<div class="row g-4">
				<aside data-include="aside.html"></aside>
				<!-- Cuerpo del carrito de compras (RF-06). -->
				<main class="col-12 col-lg-9">
					<p class="sobretitulo">Tu compra</p>
					<h1 class="h3">Carrito de compras</h1>
					<p class="text-secondary">
						El contenido del carrito se conserva en este navegador aunque cierres la pestana.
					</p>

					<div class="row g-4">
						<!-- carrito.js dibuja aqui las lineas y los armados agrupados. -->
						<div class="col-12 col-xl-8" id="contenido-carrito"></div>

						<div class="col-12 col-xl-4">
							<section class="resumen-total p-3">
								<h2 class="h6">Resumen</h2>
								<dl class="row mb-2">
									<dt class="col-6">Total</dt>
									<dd class="col-6 text-end mb-0"><span class="total" id="total-carrito">$0</span></dd>
								</dl>
								<p class="small text-secondary">
									El pago en linea y la generacion de la orden quedan para una entrega posterior.
								</p>
								<a class="btn btn-primary w-100" href="productos.html">Seguir comprando</a>
							</section>
						</div>
					</div>
				</main>
			</div>
		</div>

		<footer data-include="footer.html"></footer>

		<script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="../scripts/includes.js"></script>
		<script src="../scripts/datos.js"></script>
		<script src="../scripts/sesion.js"></script>
		<script src="../scripts/carrito.js"></script>
		<script src="../scripts/catalogo.js"></script>
	</body>
</html>
