<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<title>Panel de administracion — Ensambla.me</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Resumen del panel de administracion de Ensambla.me.">
		<link rel="icon" href="../../resources/img/logo.svg" type="image/svg+xml">
		<link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
		<link rel="stylesheet" href="../../styles/style.css">
	</head>
	<body>
		<!-- Las secciones compartidas se cargan desde su propio archivo con scripts/includes.js -->
		<header data-include="../header.html"></header>
		<div class="container my-4">
			<div class="row g-4">
				<aside data-include="aside.html"></aside>
				<!-- Cuerpo del home administrativo (RNF-08 CA5). -->
				<main class="col-12 col-lg-9" id="panel-resumen">
					<p class="sobretitulo">Administracion</p>
					<h1 class="h3">Resumen del sistema</h1>
					<p class="text-secondary mb-4">
						Estado de los datos cargados en esta sesion del navegador. Los mantenedores estan en el
						menu de la izquierda.
					</p>

					<!-- mantenedores.js llena los indicadores y los accesos. -->
					<div id="indicadores" class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3 mb-4"></div>
					<div id="accesos-panel" class="row row-cols-1 row-cols-md-3 g-3"></div>
				</main>
			</div>
		</div>

		<footer data-include="../footer.html"></footer>

		<script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="../../scripts/includes.js"></script>
		<script src="../../scripts/datos.js"></script>
		<script src="../../scripts/sesion.js"></script>
		<script src="../../scripts/mantenedores.js"></script>
	</body>
</html>
