<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<title>Productos — Panel Ensambla.me</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Mantenedor de productos del panel de administracion.">
		<link rel="icon" href="../../resources/img/logo.svg" type="image/svg+xml">
		<link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
		<link rel="stylesheet" href="../../styles/style.css">
	</head>
	<body>
		<!-- Las secciones compartidas se cargan desde su propio archivo con scripts/includes.js -->
		<header data-include="../header.html"></header>
		<div class="container my-4">
			<div class="row g-4">
				<aside data-include="aside.html"></aside>
				<!-- Cuerpo del mantenedor de productos (RF-10) y de la consulta en solo lectura (RF-12). -->
				<main class="col-12 col-lg-9">
					<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
						<div>
							<p class="sobretitulo">Mantenedor</p>
							<h1 class="h3 mb-0">Productos</h1>
							<p class="solo-lectura mb-0" id="modo-productos"></p>
						</div>
						<!-- mantenedores.js inserta el boton de crear solo para el rol Administrador. -->
						<div id="acciones-productos"></div>
					</div>

					<div id="aviso-productos" aria-live="polite"></div>
					<div class="table-responsive" id="tabla-productos"></div>
				</main>
			</div>
		</div>

		<footer data-include="../footer.html"></footer>

		<script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="../../scripts/includes.js"></script>
		<script src="../../scripts/datos.js"></script>
		<script src="../../scripts/sesion.js"></script>
		<script src="../../scripts/validaciones.js"></script>
		<script src="../../scripts/mantenedores.js"></script>
	</body>
</html>
